name: facial_recognition
description: "Sistema de Reconocimiento Facial con Múltiples Imágenes"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  image: ^4.2.1
  camera: any
  image_picker: any
  permission_handler: ^12.0.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  flutter_animate: any
  path_provider: any
  path: any
  intl: ^0.20.2
  url_launcher: any
  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/facenet_512.tflite
    - assets/models/yolo_face_detector.tflite
    - assets/models/labels.txt